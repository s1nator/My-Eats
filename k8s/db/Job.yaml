apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration-job
spec:
  backofflimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      containers:
      - name: backend-migration
        image: my-eats-backend
        command: ["/bin/sh", "-c"]
        args: ["alembic upgrade head && python seed.py"]
      envFrom:
      - configMapRef:
          name: backend-configmap
      - secretRef:
          name: backend-secret