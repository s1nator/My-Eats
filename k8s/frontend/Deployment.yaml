apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: frontend-1
    spec:
      containers:
      - image: my-eats-frontend
        imagePullPolicy: IfNotPresent
        name: frontend-1
        ports:
        - containerPort: 80