apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-http-route
spec:
  parentRefs:
  - name: app-gateway
  rules:
  - matches:
    -path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: backend-service
    port: 8000

  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend-service
      port: 8080
