role: "Agent"

service:
  enabled: false

serviceHeadless:
  enabled: false

customConfig:
  data_dir: "/vector-data-dir"

  sources:
    k8s_logs:
      type: "kubernetes_logs"
  
  transforms:
    enrich_logs:
      type: "remap"
      inputs:
        - "k8s_logs"
      source: |
        parsed, parse_error = parse_json(.message)
        if parse_error == null && is_object(parsed) {
          . = merge!(., parsed)
        } else {
          klog, klog_error = parse_regex(
            .message,
            r'^(?P<severity>[IWEF])\d{4}\s+\S+\s+\d+\s+[^:\s]+:\d+\]\s+(?P<message>.*)$'
          )
          if klog_error == null {
            .level = if klog.severity == "I" {
              "INFO"
            } else if klog.severity == "W" {
              "WARNING"
            } else if klog.severity == "E" {
              "ERROR"
            } else {
              "CRITICAL"
            }
            .message = klog.message
          }
        }

        if exists(."service.name") {
          .service.name = ."service.name"
          del(."service.name")
        }
        if exists(."service.version") {
          .service.version = ."service.version"
          del(."service.version")
        }
        if exists(."service.environment") {
          .service.environment = ."service.environment"
          del(."service.environment")
        }

        .namespace = .kubernetes.pod_namespace
        if exists(.kubernetes.pod_labels.environment) && !is_null(.kubernetes.pod_labels.environment) {
          .environment.name = .kubernetes.pod_labels.environment
        }
        if exists(.kubernetes.pod_labels.service) && !is_null(.kubernetes.pod_labels.service) && .kubernetes.pod_labels.service != "" {
          .service.name = .kubernetes.pod_labels.service
        }
        if exists(.kubernetes.pod_labels.version) && !is_null(.kubernetes.pod_labels.version) {
          .service.version = .kubernetes.pod_labels.version
        }
        .pod = .kubernetes.pod_name
        .container = .kubernetes.container_name
        if !exists(.service.name) || is_null(.service.name) || .service.name == "" {
          .service.name = .container
        }
        del(.kubernetes)

  sinks:
    victoria_logs:
      type: "elasticsearch"
      inputs:
        - "enrich_logs"
      endpoints:
        - "http://victoria-logs-single-server.victoria-logs.svc.cluster.local:9428/insert/elasticsearch/"
      mode: "bulk"
      api_version: "v8"
      healthcheck:
        enabled: false
      query:
        _stream_fields: "namespace,pod,container,environment.name,service.name,service.version"
        _msg_field: "message"
        _time_field: "timestamp"